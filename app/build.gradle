plugins {
    id 'com.android.application'
}

def buildNo = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'kr.taxiledger'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.taxiledger'
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'taxiledger'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ML Kit 과 androidx 가 서로 다른 Kotlin 버전을 끌고 와서 생기는 중복을 하나로 맞춤
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    // 비추기만 하면 읽기: 앱 안 카메라 화면
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    // 영수증 글자 읽기: 폰 안에서 동작 (인터넷·비용 없음)
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
