name: APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 비밀값이 없어요"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks

      - name: APK 빌드
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk taxi-ledger.apk

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 택시장부 1.0.${{ github.run_number }}
          body: 폰에서 taxi-ledger.apk 를 눌러 받은 뒤 설치하세요.
          files: taxi-ledger.apk
          make_latest: true
